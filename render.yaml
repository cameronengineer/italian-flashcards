# Render Blueprint: the public landing page (static site, served from ./site).
# The .apkg downloads are not in git; they are GitHub release assets
# (see flashcards/commands/site.py, DOWNLOAD_BASE).
services:
  - type: web
    runtime: static
    name: italian-flashcards
    buildCommand: echo "static site, nothing to build"
    staticPublishPath: ./site
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /samples/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
