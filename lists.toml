# What you want to learn. Each [[list]] is a source of words; a word that
# appears in several lists is ONE note in Anki, filed in the deck of its
# highest-priority list (see plan.toml) and tagged list::<id> for every list.
#
# kinds:
#   csv      italian,english CSV (words, expressions or sentences)
#   cils     CILS lists (italian_original, italian, function, english)
#   verbs    CSV of verb infinitives
#   avere    avere-expressions (avere fame, …)
#   subtlex  top-N verbs / nouns from the SUBTLEX-IT frequency list
#   numbers  ordered english,italian CSV of cardinal numbers
#   movie    Italian subtitles (.srt) — see inputs/movies/<slug>/
#
# Optional per list: deck, type (the type pill), facts (default true),
# recognition_only (default false), disabled.

[[list]]
id = "eight-mountains"
kind = "movie"
optional = true
shareable = false
title = "Le otto montagne (2022)"
path = "movies/eight-mountains/subs.it.srt"
deck = "Italian::Movies::Le otto montagne"
recognition_only = true

[[list]]
id = "cils-a1"
kind = "cils"
title = "CILS A1"
path = "cils/cils_a1.csv"
deck = "Italian::CILS::A1"

[[list]]
id = "cils-a2"
kind = "cils"
title = "CILS A2"
path = "cils/cils_a2.csv"
deck = "Italian::CILS::A2"

[[list]]
id = "cils-b1"
kind = "cils"
title = "CILS B1"
path = "cils/cils_b1.csv"
deck = "Italian::CILS::B1"

[[list]]
id = "cils-b2"
kind = "cils"
title = "CILS B2"
path = "cils/cils_b2.csv"
deck = "Italian::CILS::B2"

[[list]]
id = "numbers"
kind = "numbers"
title = "Numbers"
path = "italian_numbers.csv"
deck = "Italian::Basics::Numbers"
type = "number"
facts = false

[[list]]
id = "fluent-forever"
kind = "csv"
title = "Fluent Forever 625"
path = "fluentforever/fluentforever_625.csv"
deck = "Italian::Core::Fluent Forever 625"
type = "core word"

[[list]]
id = "tutto-bene"
kind = "csv"
title = "Tutto bene"
path = "tuttobene/tuttobene.csv"
deck = "Italian::Core::Tutto bene"
type = "word"

[[list]]
id = "frequency"
kind = "subtlex"
title = "Most frequent words"
path = "freqdic/subtlex-it.cleaned.csv"
deck = "Italian::Frequency"
verb_limit = 400
noun_limit = 1000
