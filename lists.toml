# What you want to learn. Each [[list]] is a source of words; a word that
# appears in several lists is ONE note in Anki, filed in the deck of its
# highest-priority list (see plan.toml) and tagged list::<id> for every list.
#
# kinds:
#   csv      italian,english CSV (words, expressions or sentences)
#   cils     CILS lists (italian_original, italian, function, english)
#   verbs    CSV of verb infinitives
#   avere    avere-expressions (avere fame, …)
#   subtlex  top-N verbs / nouns from the SUBTLEX-IT frequency list
#   numbers  generated by rule (no input file)
#   movie    Italian subtitles (.srt) — see inputs/movies/<slug>/
#
# Optional per list: deck, type (the type pill), facts (default true),
# recognition_only (default false), disabled.

[[list]]
id = "eight-mountains"
kind = "movie"
title = "Le otto montagne (2022)"
path = "movies/eight-mountains/subs.it.srt"
deck = "Italian::Movies::Le otto montagne"
