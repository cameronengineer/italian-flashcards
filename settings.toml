# Pipeline settings. Every tunable lives here; `flashcards/settings.py` holds
# the defaults and documents each key. What to learn lives in lists.toml,
# when to learn it in plan.toml.

[ai]
# Every text / JSON task (word prompts + verification, fun facts, verb
# prompts, disambiguation, audits, practice) runs on Claude via `claude -p` —
# your Claude subscription; `claude` must be logged in. Images use Codex.
model = "haiku"          # cheap while the workflow settles; to redo everything with a
                         # stronger model later: change this AND bump task_version below
effort = "medium"
thinking = false         # Claude's hidden reasoning: off = ~8x fewer output tokens and faster;
                         # turn on for the high-quality regeneration
timeout = 600            # seconds per call
concurrency = 4          # calls in flight at once
# Usage limit hit / logged out / out of credits / offline: pause all AI work
# and retry every N minutes until it works again.
unavailable_retry_minutes = 5
# Give up after this many minutes of waiting (0 = wait as long as it takes).
max_unavailable_minutes = 0
# Bump this to redo ALL AI work from scratch (e.g. after switching to a stronger model).
task_version = "5"

[ai.task_models]
# Per-task overrides, e.g. practice_feedback = "sonnet". Task names are in
# flashcards/tasks.py. None for now: everything uses the model above.

[facts]
# "Did you know?" notes (etymology, links to English, false friends…).
enabled = true
# Facts below this model-reported confidence are stored but not shown.
min_confidence = 0.75

[audio]
voice_id = "HuK8QKF35exsCh2e7fLT"
model = "eleven_multilingual_v2"
format = "mp3_44100_128"
language = "it"
stability = 0.5
similarity_boost = 1.0
style = 1.0
speed = 0.7
compressed_bitrate = "48k"

[images]
# Generated by Codex CLI signed in to ChatGPT (`codex login`); no API key.
# Every card needs an image: a note waits for its image before it goes to Anki.
required = true
codex_timeout = 900      # seconds per image
compressed_max_px = 512
compressed_quality = 75

[run]
# Defaults for `flashcards run` / ./run.sh (CLI flags override).
# New assets created per run: 0 = none, -1 = no limit.
image_limit = 0          # Codex images (0 = Codex never runs)
audio_limit = 1          # ElevenLabs audio files (credit cap)
max_batches = 20         # Claude batches between Anki syncs
audio_workers = 5        # ElevenLabs' concurrent-request limit
compress_workers = 8

[anki]
url = "http://127.0.0.1:8765"

[backups]
keep_last = 10
# Optional second copy outside the repo, e.g. "~/Library/Mobile Documents/com~apple~CloudDocs/flashcards-backups".
mirror_dir = ""

[audit]
workers = 500

[practice]
words = 50
sentences = 10
length = "medium"
no_subjunctive = true

[leech]
threshold = 5
relearn_steps = [10]
