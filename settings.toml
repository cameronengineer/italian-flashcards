# Pipeline settings. Every tunable lives here; `flashcards/settings.py` holds
# the defaults and documents each key. Deck/source config lives in
# sources.json, not here.

[ai]
# Every text / JSON task (word prompts + verification, fun facts, verb
# prompts, disambiguation, audits, practice) runs on Claude via `claude -p` —
# your Claude subscription; `claude` must be logged in. Images use Codex.
model = "opus"
effort = "medium"
timeout = 600            # seconds per call
concurrency = 4          # calls in flight at once
# Usage limit hit / logged out / out of credits / offline: pause all AI work
# and retry every N minutes until it works again.
unavailable_retry_minutes = 5

[ai.task_models]
# Per-task overrides. Task names are listed in flashcards/tasks.py.
practice_sentence = "sonnet"
practice_feedback = "sonnet"

[facts]
# "Did you know?" notes (etymology, links to English, false friends…).
enabled = true
# Facts below this model-reported confidence are stored but not shown.
min_confidence = 0.75
batch_size = 25          # words per AI request

[audio]
voice_id = "HuK8QKF35exsCh2e7fLT"
model = "eleven_multilingual_v2"
format = "mp3_44100_128"
language = "it"
stability = 0.5
similarity_boost = 1.0
style = 1.0
speed = 0.7
compressed_bitrate = "48k"

[images]
# Generated by Codex CLI signed in to ChatGPT (`codex login`); no API key.
codex_concurrency = 2
codex_timeout = 900      # seconds per image
compressed_max_px = 512
compressed_quality = 75

[run]
# Defaults for `flashcards run` / ./run.sh (CLI flags override).
audio_workers = 5        # ElevenLabs' concurrent-request limit
compress_workers = 8
audio_limit = 1          # new audio files per run (ElevenLabs credit cap)

[sync]
orphan_ratio_limit = 0.10
orphan_absolute_limit = 200

[anki]
url = "http://127.0.0.1:8765"

[backups]
keep_last = 10
# Optional second copy outside the repo, e.g. "~/Library/Mobile Documents/com~apple~CloudDocs/flashcards-backups".
mirror_dir = ""

[review]
min_confidence = 0.7

[audit]
workers = 500

[practice]
words = 50
sentences = 10
length = "medium"
no_subjunctive = true

[leech]
threshold = 5
relearn_steps = [10]
