# Study plan: what to learn first. The new-card queue in Anki is ordered by
# these priorities (deadline lists first), skipping words you already know.
# A word in several lists has a card in each list's deck; priority only sets the order.

new_cards_per_day = 25       # used for the "you'll finish by …" estimate
# A little randomness in each deck's new-card order: a card moves at most about
# this many places (so numbers don't go 1, 2, 3 …). 0 = strict list order.
shuffle_window = 20
# Every word is prepared and published in study order; Anki's daily new-card
# limit paces what you see.

[[priority]]
list = "eight-mountains"
by = "2026-10-31"            # watch date — its unknown words come first

[[priority]]
list = "benvenuti-al-sud"    # add  by = "YYYY-MM-DD"  once you know when you'll watch it

[[priority]]
list = "cils-a1"
[[priority]]
list = "fluent-forever"
[[priority]]
list = "cils-a2"
[[priority]]
list = "cils-b1"
[[priority]]
list = "numbers"
[[priority]]
list = "cils-b2"
[[priority]]
list = "frequency"

[conjugation]
# Generate and retain all of these tenses, including those not currently studied.
tenses = [
  "presente", "passato_prossimo", "imperfetto", "futuro_semplice",
  "presente_progressivo", "imperativo", "condizionale_presente", "condizionale_passato",
]
# These forms go into Learning subdecks. All other generated forms go into
# Dormant subdecks, suspended until moved to Learning by this configuration.
deck = "Italian::Verbs"
learning_tenses = [
  "presente", "passato_prossimo", "futuro_semplice", "imperativo",
  "imperfetto", "presente_progressivo",
]
learning_imperative_persons = ["Lei", "tu"]
# Full form cards for irregular verbs plus the N most frequent verbs; every
# other (regular) verb is covered by pattern cards + its infinitive card.
full_forms_top = 120

[cards]
# A note's production card (English → Italian) can be switched off per list
# with recognition_only = true in lists.toml.
noun_phrases = true          # rule-built article / preposition drills
cognates = true              # "-zione = -tion" family cards
patterns = true              # regular conjugation pattern cards
