[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcards"
version = "4.0.0"
description = "Italian Anki pipeline: lists → Wiktionary-grounded lexicon → Claude + Codex → Anki."
requires-python = ">=3.11"
# Pinned so re-running the pipeline is reproducible. Bump deliberately.
dependencies = [
    "genanki==0.13.1",      # .apkg generation + deterministic GUIDs
    "Pillow==12.2.0",       # PNG → JPEG image compression
    "elevenlabs==2.47.0",   # ElevenLabs TTS client
]

[project.optional-dependencies]
dev = ["pyflakes"]

[project.scripts]
flashcards = "flashcards.cli:main"

[tool.setuptools]
packages = ["flashcards", "flashcards.commands"]
